
<!DOCTYPE html>
<html>
<head>
    <title>Register Form</title>
    <link rel="stylesheet" href="C:\Users\admin\OneDrive\Documents\java_full_stack_project\styles\Signup.css">
</head>

<body>

    <form>

        <fieldset>

            <legend>Register</legend>

            <div class="row">
                <label for="username">Username:</label>
                <input type="text"
                       id="username"
                       placeholder="Enter Name"
                       required>
            </div>

            <div class="row">
                <label for="email">Email:</label>
                <input type="email"
                       id="email"
                       placeholder="Enter Email"
                       required>
            </div>

            <div class="row">
                <label for="password">Password:</label>

                <div class="password-box">
                    <input type="password"
                           id="password"
                           placeholder="Enter Password"
                           required>

                    <span>👁️</span>
                </div>
            </div>

            <div class="row">
                <label for="confirm-password">
                    Confirm Password:
                </label>

                <div class="password-box">
                    <input type="password"
                           id="confirm-password"
                           placeholder="Confirm Password"
                           required>

                    <span>👁️</span>
                </div>
            </div>

            <div class="row">
                <label for="dov">date of birth:</label>

                <input type="date"
                       id="dov"
                       placeholder="Enter Date of Birth"
                       required>
            </div>

            <div class="row">
                <label>Gender:</label>

                <div class="gender">
                    <input type="radio"
                           id="male"
                           name="gender"
                           value="male"
                           required>

                    <label for="male">Male</label>

                    <input type="radio"
                           id="female"
                           name="gender"
                           value="female">

                    <label for="female">Female</label>
                    <input type="radio"
                           id="other"
                           name="gender"
                           value="other">

                    <label for="other">Other</label>
                </div>
            </div>

            <div class="row">
                <label for="state">State:</label>

                <select id="state" required>
                    <option value="">Select State</option>
                    <option>Andhra Pradesh</option>
                    <option>Telangana</option>
                    <option>Karnataka</option>
                    <option>Tamil Nadu</option>
                    <option>Kerala</option>
                    <option>Maharashtra</option>
                </select>
            </div>

            <div class="row">
                <label for="phone">Phone:</label>

                <input type="tel"
                       id="phone"
                       pattern="[6-9]{1}[0-9]{9}"
                       placeholder="Enter Phone Number"
                       required>
            </div>

            <div class="row">
                <label for="country">Country :</label>

                <select id="country" required>
                    <option value="">Select Country</option>
                    <option>India</option>
                    <option>USA</option>
                    <option>UK</option>
                    <option>Australia</option>
                    <option>Japan</option>
                </select>
            </div>

            <br>
            
            <button type="submit"><a href="C:\Users\admin\OneDrive\Documents\java_full_stack_project\pages\Home-Page.html">Register</a></button>
            
            <button type="reset">Reset</button>

        </fieldset>

    </form>

</body>
</html>
